plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// 签名信息从 local.properties 读取（该文件不入库）。
// 未配置时 release 包不带签名，仅用于本地调试构建。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('local.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.getProperty('RELEASE_STORE_FILE') != null

android {
    namespace 'com.mine.myjizhang'
    compileSdk 34

    defaultConfig {
        applicationId "com.mine.myjizhang"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.6.5"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps.getProperty('RELEASE_STORE_FILE'))
                storePassword keystoreProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias keystoreProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword keystoreProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
